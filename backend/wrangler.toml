name = "catan-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "LOBBY_ROOM", class_name = "LobbyRoom" },
]

[[migrations]]
tag = "v1"
new_classes = ["GameRoom", "LobbyRoom"]

# Set secrets per environment:
# wrangler secret put NEON_DATABASE_URL --env production
# wrangler secret put GOOGLE_CLIENT_ID --env production
# wrangler secret put GOOGLE_CLIENT_SECRET --env production
# wrangler secret put RESEND_API_KEY --env production

# Crons:
# - Sundays 3am UTC: orphan guest account cleanup
# - Every 4 hours: abandoned game / lobby cleanup (phase != 'ended' && stale updatedAt)
[triggers]
crons = ["0 3 * * 0", "0 */4 * * *"]

[vars]
FRONTEND_URL = "http://localhost:3000"
ENVIRONMENT = "development"

# ── Staging ───────────────────────────────────────────────────────────────────
[env.staging]
name = "catan-backend-staging"
[env.staging.vars]
FRONTEND_URL = "https://staging.catangame.com"
ENVIRONMENT = "staging"
[env.staging.triggers]
crons = ["0 3 * * 0", "0 */4 * * *"]

# ── Production ────────────────────────────────────────────────────────────────
[env.production]
name = "catan-backend-production"
[env.production.vars]
FRONTEND_URL = "https://catangame.com"
ENVIRONMENT = "production"
[env.production.triggers]
crons = ["0 3 * * 0", "0 */4 * * *"]
